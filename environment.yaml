name: biophys_helpers
channels:
  - defaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - openpyxl
  - matplotlib
  - pyyaml
  # Pinned to the coherent hdf5 1.14.5 stack on the `defaults` channel.
  # The freshly-shipped hdf5 2.0.0 build ships an h5py binary linked against a
  # mismatched hdf5 build, causing "DLL load failed ... specified procedure
  # could not be found" on `import h5py`. Revisit once 2.0.0 stabilizes.
  - hdf5=1.14.5
  - h5py=3.15.1
  - pytables=3.10.2
  - pillow
  # Parquet reader for browse_parquet.py, and for the sibling metadata parquet
  # that browse_pt.py reports on. pandas treats it as an optional extra, so it
  # has to be requested explicitly.
  #
  # Note there is deliberately no pytorch dependency: browse_pt.py reads .pt
  # files by parsing the zip archive and stubbing the pickle, which recovers
  # every shape and dtype without a ~2 GB install and without loading tensor
  # data.
  - pyarrow
